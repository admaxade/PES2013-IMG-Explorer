name: Build PES 2013 IMG Explorer V9 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V9 project ZIP
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          files = list(Path(".").glob("*.zip"))

          selected = None
          for f in files:
              try:
                  with zipfile.ZipFile(f) as z:
                      names = z.namelist()
                      if any(n.endswith("/gradlew") for n in names):
                          selected = f
                          break
              except Exception:
                  pass

          if selected is None:
              raise SystemExit("ERROR: Project ZIP not found")

          print("Selected:", selected)
          with zipfile.ZipFile(selected) as z:
              z.extractall("project")
          PY

      - name: Locate project
        run: |
          PROJECT_DIR=$(find project -type f -name gradlew -printf '%h\n' | head -n 1)
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon clean assembleDebug

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PES2013-IMG-Explorer-V9-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
