name: Build PES 2013 IMG Explorer V9 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check and Extract Project ZIP
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          archives = sorted(
              Path(".").glob("*.zip"),
              key=lambda f: f.stat().st_mtime,
              reverse=True
          )

          selected = None

          for archive in archives:
              try:
                  with zipfile.ZipFile(archive) as z:
                      names = z.namelist()

                      has_gradlew = any(
                          n == "gradlew" or n.endswith("/gradlew")
                          for n in names
                      )

                      has_settings = any(
                          n == "settings.gradle" or
                          n == "settings.gradle.kts" or
                          n.endswith("/settings.gradle") or
                          n.endswith("/settings.gradle.kts")
                          for n in names
                      )

                      if has_gradlew and has_settings:
                          selected = archive
                          break

              except zipfile.BadZipFile:
                  continue

          if selected is None:
              raise SystemExit(
                  "ERROR: No valid Android Gradle project ZIP found"
              )

          print("Selected project:", selected)

          with zipfile.ZipFile(selected) as z:
              z.extractall("project")

          print("Project extracted successfully")
          PY

      - name: Locate Android Project
        run: |
          PROJECT_DIR=$(find project -type f -name gradlew \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          ls -la "$PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Components
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare Gradle Wrapper
        run: |
          cd "$PROJECT_DIR"

          chmod +x gradlew

          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "ERROR: Gradle wrapper JAR missing"
            exit 1
          fi

          ./gradlew --version

      - name: Build Android APK
        run: |
          cd "$PROJECT_DIR"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean assembleDebug

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated"
            find "$PROJECT_DIR" -name "*.apk"
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PES2013-IMG-Explorer-V9-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
